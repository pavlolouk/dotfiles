# Global markdownlint-cli2 configuration

# Core rule configuration
config:
  default: true # Enable all default rules
  MD013: false # Disable line-length rule globally
  MD024:
    siblings_only: true # Allow duplicate headings across different parent sections
  MD029:
    style: "ordered" # Force ordered lists (1. 2. 3.) over prefix style (1. 1. 1.)
  MD025: false
  MD033: false

  # Files/folders to ignore globally
ignores:
  - ".git/**"
  - "node_modules/**"
  - "dist/**"
  - "vendor/**"

# Terminal preferences
noProgress: true # Suppress progress output for cleaner terminal runs
